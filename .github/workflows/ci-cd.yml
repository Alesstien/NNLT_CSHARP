name: CI/CD Pipeline - QuanLyNhaHang

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build Solution & Run Unit Tests
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore QuanLyNhaHang.sln

    - name: Build Solution (Release)
      run: dotnet build QuanLyNhaHang.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test QLNH.Tests/QLNH.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-verify:
    name: Build & Verify Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Web Docker Image
      run: docker build -t qlnh-web:latest -f QLNH.Web/Dockerfile .

    - name: Validate Docker Compose Configuration
      run: docker compose config
